Version: 4
Settings:
  Max-Pin-Length: 4
  Hide-Inventories: false
  Use-Custom-Heads: true
  Date-Format: "dd/MM/yyyy HH:mm:ss"
  Max-Session-Time: 120
  # On servers that have dialogs (1.21.6 and up), show the settings and confirmations in dialogs.
  Use-Dialogs: true
  # Also show the login and register PIN keypad as a dialog, when Use-Dialogs is on.
  # It is a keypad of buttons, not a text box, and the PIN shows as stars as it is typed.
  Dialog-Keypad: false
  BungeeCord:
    Connect-Lobby: false
    Lobby-Server: "lobby"
Strings:
  Prefix: "&fReal&7Login &7> &f"
  Kick-Message: "&7You left the server."
  GUI:
    PIN: "&6&lPIN: &8&l"
    Login: "&8&lLogin"
    Register: "&c&lRegister"
    Items:
      Leave-Server:
        Name: "&cLeave"
        Description: "&7Click here to leave the server."
      Remove-Number:
        Name: "&aRemove Last Digit"
        Description: "&7Click here to erase the last digit."
      Confirm-Pin:
        Name: "&aConfirm"
        Description: "&7Click here to confirm your PIN. Right click to remove last digit."
  Titles:
    Registered:
      Up: "&9&lRegistered!"
      Down: "&bRemember your PIN, you will need it to log back in."
    Login:
      Up: "&a&lLogged in!"
      Down: "&2Welcome back to the server."
    Sending:
      Up: "&6&lConnecting...."
      Down: "&eto lobby server."
  Messages:
    Admin:
      Bypass-Granted: "&fLogin bypass granted for &a%player%&f."
      Bypass-Target: "&aYour login was bypassed by an administrator."
  # Shown in dialogs, on servers that have them (1.21.6 and up).
  Dialogs:
    Reset-Pin:
      Title: "&fReal&7Login &8| &fReset PIN"
      Question: "&fReset your PIN? You will choose a new one straight away."
      Button: "&cReset my PIN"
    Cancel: "&7Cancel"